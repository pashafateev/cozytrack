version: 1
timezone: America/Los_Angeles

repositories:
  - id: cozytrack
    provider: github
    remote: pashafateev/cozytrack

sources:
  - id: cozytrack-issues
    provider: github
    type: issue
    scope: pashafateev/cozytrack

workflows:
  collect:
    enabled: true
    sources: [cozytrack-issues]
    implement:
      mode: never
    reply:
      mode: never
    close:
      mode: never

skill_prompts:
  factory-collect: |
    Collect open GitHub issues from pashafateev/cozytrack only; exclude pull
    requests. Follow pagination to the end and report the coverage and count.
    Preserve each issue's number, link, useful discussion, and relevant context.
    Do not implement changes, reply, or close issues. Keep unresolved questions
    as human decisions in the report.
