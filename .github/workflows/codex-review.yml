name: Codex review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "*.png"
      - "**/*.png"
      - "*.jpg"
      - "**/*.jpg"
      - "*.jpeg"
      - "**/*.jpeg"
      - "*.gif"
      - "**/*.gif"
      - "*.webp"
      - "**/*.webp"
      - "*.avif"
      - "**/*.avif"
  issue_comment:
    types: [created]

jobs:
  codex:
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.type != 'Bot'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/codex review') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr_context.outputs.number }}
    steps:
      - name: Resolve PR context
        id: pr_context
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.eventName === "pull_request"
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            const pr = context.eventName === "pull_request"
              ? context.payload.pull_request
              : (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                })).data;

            core.setOutput("number", String(pr.number));
            core.setOutput("base_ref", pr.base.ref);
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("title", pr.title ?? "");
            core.setOutput("body", pr.body ?? "");
            core.setOutput(
              "same_repo",
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` ? "true" : "false",
            );

      - name: Skip fork PR
        if: steps.pr_context.outputs.same_repo != 'true'
        run: echo "Codex review is skipped for forked pull requests."

      - name: Check OpenAI API key
        id: api_key
        if: steps.pr_context.outputs.same_repo == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex review."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        with:
          ref: refs/pull/${{ steps.pr_context.outputs.number }}/merge
          persist-credentials: false

      - name: Pre-fetch PR refs
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        env:
          PR_BASE_REF: ${{ steps.pr_context.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr_context.outputs.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Initialize Codex feedback artifact
        run: |
          mkdir -p codex-review-output
          : > codex-review-output/final-message.md
          printf '%s\n' '${{ steps.pr_context.outputs.number }}' > codex-review-output/pr-number.txt

      - name: Set up latest Codex CLI
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Codex review with model fallback
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        env:
          CODEX_REVIEW_FALLBACK_MODEL: ${{ vars.CODEX_REVIEW_FALLBACK_MODEL }}
          CODEX_REVIEW_PROMPT: |
            Review pull request #${{ steps.pr_context.outputs.number }} in ${{ github.repository }} for bugs, regressions, security issues, and missing tests.
            Review only the changes from ${{ steps.pr_context.outputs.base_sha }} to ${{ steps.pr_context.outputs.head_sha }} (trigger: ${{ github.event_name }}). Do not suggest broad refactors or style-only changes.
            Prioritize actionable findings with file and line references. If there are no findings, say that clearly. Do not edit files or create commits.

            Pull request title and body:
            ----
            ${{ steps.pr_context.outputs.title }}
            ${{ steps.pr_context.outputs.body }}
        run: |
          set -uo pipefail
          attempt_output="$RUNNER_TEMP/codex-review-attempt.md"

          run_attempt() {
            local label="$1"
            local status
            shift
            rm -f "$attempt_output" || return 1
            echo "::group::$label"
            printf '%s\n' "$CODEX_REVIEW_PROMPT" | codex exec \
              --cd "$GITHUB_WORKSPACE" \
              --output-last-message "$attempt_output" \
              --color never \
              --sandbox read-only \
              "$@" \
              -
            status=$?
            echo "::endgroup::"

            if [ "$status" -eq 0 ] && grep -q '[^[:space:]]' "$attempt_output"; then
              mv "$attempt_output" codex-review-output/final-message.md || return 1
              return 0
            fi

            echo "::warning::$label failed or returned empty feedback (exit $status)."
            return 1
          }

          if run_attempt "Codex review with default model"; then
            exit 0
          fi

          if [ -z "${CODEX_REVIEW_FALLBACK_MODEL:-}" ]; then
            echo "::error::CODEX_REVIEW_FALLBACK_MODEL is not configured."
            exit 1
          fi

          if run_attempt \
            "Codex review with configured fallback model" \
            --model "$CODEX_REVIEW_FALLBACK_MODEL"
          then
            exit 0
          fi

          echo "::error::Default and fallback Codex reviews both failed."
          exit 1

      - name: Upload Codex feedback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-feedback
          path: codex-review-output
          if-no-files-found: error
          retention-days: 1
