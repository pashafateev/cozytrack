name: Codex review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "*.png"
      - "**/*.png"
      - "*.jpg"
      - "**/*.jpg"
      - "*.jpeg"
      - "**/*.jpeg"
      - "*.gif"
      - "**/*.gif"
      - "*.webp"
      - "**/*.webp"
      - "*.avif"
      - "**/*.avif"
  issue_comment:
    types: [created]

jobs:
  codex:
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.type != 'Bot'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/codex review') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr_context.outputs.number }}
    steps:
      - name: Resolve PR context
        id: pr_context
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.eventName === "pull_request"
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            const pr = context.eventName === "pull_request"
              ? context.payload.pull_request
              : (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                })).data;

            core.setOutput("number", String(pr.number));
            core.setOutput("base_ref", pr.base.ref);
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("title", pr.title ?? "");
            core.setOutput("body", pr.body ?? "");
            core.setOutput(
              "same_repo",
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` ? "true" : "false",
            );

      - name: Skip fork PR
        if: steps.pr_context.outputs.same_repo != 'true'
        run: echo "Codex review is skipped for forked pull requests."

      - name: Check OpenAI API key
        id: api_key
        if: steps.pr_context.outputs.same_repo == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex review."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        with:
          ref: refs/pull/${{ steps.pr_context.outputs.number }}/merge
          persist-credentials: false

      - name: Pre-fetch PR refs
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        env:
          PR_BASE_REF: ${{ steps.pr_context.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr_context.outputs.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Initialize Codex review files
        uses: actions/github-script@v7
        env:
          PR_BASE_SHA: ${{ steps.pr_context.outputs.base_sha }}
          PR_BODY: ${{ steps.pr_context.outputs.body }}
          PR_HEAD_SHA: ${{ steps.pr_context.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr_context.outputs.number }}
          PR_TITLE: ${{ steps.pr_context.outputs.title }}
          TRIGGER_NAME: ${{ github.event_name }}
        with:
          script: |
            const fs = require("node:fs");
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid Codex review PR number: ${process.env.PR_NUMBER}`);
              return;
            }

            const prompt = [
              "Review this pull request for bugs, regressions, security issues, and missing tests.",
              "",
              "Scope:",
              `- Repository: ${context.repo.owner}/${context.repo.repo}`,
              `- PR: #${prNumber}`,
              `- Base SHA: ${process.env.PR_BASE_SHA}`,
              `- Head SHA: ${process.env.PR_HEAD_SHA}`,
              `- Trigger: ${process.env.TRIGGER_NAME}`,
              "",
              "Review only the changes introduced by this PR. Do not suggest broad refactors or style-only changes.",
              "Prioritize actionable findings with file and line references. If there are no findings, say that clearly.",
              "Do not edit files or create commits.",
              "",
              "Pull request title and body:",
              "----",
              process.env.PR_TITLE ?? "",
              process.env.PR_BODY ?? "",
              "",
            ].join("\n");

            fs.mkdirSync("codex-review-output", { recursive: true });
            fs.writeFileSync("codex-review-output/final-message.md", "");
            fs.writeFileSync("codex-review-output/pr-number.txt", `${prNumber}\n`);
            fs.writeFileSync("codex-review-prompt.md", prompt);

      - name: Find last-known-good Codex model
        id: prior_model
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        uses: actions/github-script@v7
        env:
          PR_BASE_SHA: ${{ steps.pr_context.outputs.base_sha }}
        with:
          script: |
            const fs = require("node:fs");
            const response = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "codex-review-model",
              per_page: 100,
            });
            const artifact = response.data.artifacts
              .filter((candidate) =>
                !candidate.expired &&
                candidate.workflow_run?.id !== context.runId
              )
              .sort((left, right) =>
                Date.parse(right.created_at) - Date.parse(left.created_at)
              )[0];

            if (!artifact?.workflow_run?.id) {
              core.notice("No previous Codex model artifact is available yet.");
              const baseWorkflow = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".github/workflows/codex-review.yml",
                ref: process.env.PR_BASE_SHA,
              });
              if (!Array.isArray(baseWorkflow.data) && baseWorkflow.data.content) {
                const source = Buffer.from(baseWorkflow.data.content, "base64").toString("utf8");
                const priorPin = source.match(
                  /^\s+model:\s*["']?([^\s#"']+)["']?\s*(?:#.*)?$/m,
                )?.[1];
                if (priorPin) {
                  fs.mkdirSync("codex-review-state", { recursive: true });
                  fs.writeFileSync(
                    "codex-review-state/last-known-good-model.txt",
                    `${priorPin}\n`,
                  );
                  core.notice(`Seeded last-known-good model ${priorPin} from the base workflow.`);
                }
              }
              core.setOutput("found", "false");
              return;
            }

            core.info(`Using model state from workflow run ${artifact.workflow_run.id}.`);
            core.setOutput("found", "true");
            core.setOutput("run_id", String(artifact.workflow_run.id));

      - name: Download last-known-good Codex model
        if: steps.prior_model.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: codex-review-model
          path: codex-review-state
          run-id: ${{ steps.prior_model.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up latest Codex CLI
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Codex review with model fallback
        if: steps.pr_context.outputs.same_repo == 'true' && steps.api_key.outputs.available == 'true'
        env:
          CODEX_REVIEW_FALLBACK_MODEL: ${{ vars.CODEX_REVIEW_FALLBACK_MODEL }}
        run: |
          node .github/scripts/run-codex-review.mjs \
            --prompt-file codex-review-prompt.md \
            --output-file codex-review-output/final-message.md \
            --previous-model-file codex-review-state/last-known-good-model.txt \
            --state-file codex-review-state-next/last-known-good-model.txt \
            --working-directory "$GITHUB_WORKSPACE"

      - name: Save last-known-good Codex model
        if: >-
          ${{
            success() &&
            steps.pr_context.outputs.same_repo == 'true' &&
            steps.api_key.outputs.available == 'true'
          }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-model
          path: codex-review-state-next/last-known-good-model.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload Codex feedback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-feedback
          path: codex-review-output
          if-no-files-found: error
          retention-days: 1
