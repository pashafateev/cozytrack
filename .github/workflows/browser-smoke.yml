name: Browser smoke

on:
  pull_request:
    paths:
      - ".github/workflows/browser-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "playwright.config.ts"
      - "docker-compose.yml"
      - "livekit.yaml"
      - "prisma/**"
      - "scripts/minio-bucket.sh"
      - "scripts/test-browser-smoke.sh"
      - "src/middleware.ts"
      - "src/app/api/auth/**"
      - "src/app/api/livekit-token/**"
      - "src/app/api/sessions/**"
      - "src/app/api/upload/**"
      - "src/app/join/**"
      - "src/app/signin/**"
      - "src/app/page.tsx"
      - "src/app/session/**"
      - "src/app/studio/**"
      - "src/components/**"
      - "src/hooks/**"
      - "src/lib/api-auth.ts"
      - "src/lib/audio-downmix.ts"
      - "src/lib/audio-meter.ts"
      - "src/lib/audio-splitter.ts"
      - "src/lib/auth-password.ts"
      - "src/lib/auth.ts"
      - "src/lib/db.ts"
      - "src/lib/devices.ts"
      - "src/lib/livekit.ts"
      - "src/lib/monitor-bus.ts"
      - "src/lib/recording-*.ts"
      - "src/lib/recorder.ts"
      - "src/lib/recovery.ts"
      - "src/lib/s3.ts"
      - "src/lib/session-lock.ts"
      - "src/lib/sessions.ts"
      - "src/lib/track-materialization.ts"
      - "src/lib/transport/**"
      - "src/lib/upload*.ts"
      - "tests/browser/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "playwright.config.ts"
      - "docker-compose.yml"
      - "livekit.yaml"
      - "prisma/**"
      - "scripts/minio-bucket.sh"
      - "scripts/test-browser-smoke.sh"
      - "src/middleware.ts"
      - "src/app/api/auth/**"
      - "src/app/api/livekit-token/**"
      - "src/app/api/sessions/**"
      - "src/app/api/upload/**"
      - "src/app/join/**"
      - "src/app/signin/**"
      - "src/app/page.tsx"
      - "src/app/session/**"
      - "src/app/studio/**"
      - "src/components/**"
      - "src/hooks/**"
      - "src/lib/api-auth.ts"
      - "src/lib/audio-downmix.ts"
      - "src/lib/audio-meter.ts"
      - "src/lib/audio-splitter.ts"
      - "src/lib/auth-password.ts"
      - "src/lib/auth.ts"
      - "src/lib/db.ts"
      - "src/lib/devices.ts"
      - "src/lib/livekit.ts"
      - "src/lib/monitor-bus.ts"
      - "src/lib/recording-*.ts"
      - "src/lib/recorder.ts"
      - "src/lib/recovery.ts"
      - "src/lib/s3.ts"
      - "src/lib/session-lock.ts"
      - "src/lib/sessions.ts"
      - "src/lib/track-materialization.ts"
      - "src/lib/transport/**"
      - "src/lib/upload*.ts"
      - "tests/browser/**"

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser recording smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser
